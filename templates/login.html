<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Industries - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body { 
            background-color: #121214; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        .container_login { 
            max-width: 400px; 
            margin-top: 10%; 
            padding: 30px; 
            background-color: #1a1a1e; 
            border-radius: 8px; 
            border: 1px solid rgba(201, 160, 220, 0.3); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }

        .botao { 
            background-color: #212529; 
            border: 1px solid #ffc107; 
            color: #ffc107; 
            font-weight: 600;
        }

        .botao:hover { 
            background-color: #ffc107; 
            color: #000; 
        }
      
        .texto_branco {
            color: #cfd2d6 !important;
        }

        .subtitulo {
            color: #a0a5b0 !important;
            letter-spacing: 4px;
            font-weight: 500;
        }

    </style>
</head>
<body>
    <div class="container d-flex flex-column align-items-center justify-content-center">
        <div class="container_login w-100">
            <h2 class="text-center mb-1 fw-bold text-white">WAYNE</h2>
            <p class="text-center subtitulo uppercase mb-4" style="font-size: 0.85rem;">INDUSTRIES</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} p-2 small text-center" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label texto_branco">E-mail de Acesso</label>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required placeholder="exemplo@wayne.com">
                </div>
                <div class="mb-3">
                    <label class="form-label texto_branco">Senha de Segurança</label>
                    <input type="password" name="senha" class="form-control bg-dark text-white border-secondary" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn botao w-100 mt-2">Autenticar Sistema</button>
            </form>

        </div>
    </div>
</body>
</html>
